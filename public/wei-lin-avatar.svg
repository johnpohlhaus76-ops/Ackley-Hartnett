<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#1e3a8a"/>

  <!-- Gradient for face -->
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d2a679;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="url(#skinGradient)"/>

  <!-- Hair -->
  <path d="M 55 85 Q 55 40 100 40 Q 145 40 145 85" fill="#1a1a1a"/>

  <!-- Eyes -->
  <circle cx="80" cy="80" r="6" fill="#000"/>
  <circle cx="120" cy="80" r="6" fill="#000"/>
  <circle cx="82" cy="78" r="2" fill="#fff"/>
  <circle cx="122" cy="78" r="2" fill="#fff"/>

  <!-- Nose -->
  <path d="M 100 80 L 100 95" stroke="#d2a679" stroke-width="2" fill="none"/>

  <!-- Mouth - Smile -->
  <path d="M 85 105 Q 100 115 115 105" stroke="#c41e3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="90" y="125" width="20" height="15" fill="url(#skinGradient)"/>

  <!-- Shirt/Collar -->
  <path d="M 60 140 L 85 140 L 85 175 L 115 175 L 115 140 L 140 140 L 135 145 L 65 145 Z" fill="#2563eb"/>

  <!-- Highlight on face for dimension -->
  <ellipse cx="75" cy="70" rx="12" ry="15" fill="#f5d5b8" opacity="0.4"/>

  <!-- Eyebrows -->
  <path d="M 70 65 Q 80 62 90 65" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 110 65 Q 120 62 130 65" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
